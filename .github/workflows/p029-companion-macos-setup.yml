name: P029 Mac GUI Companion installer - isolated preview

on:
  push:
    branches:
      - feat/p029-browser-companion-r3-expanded-20261116
    paths:
      - 'experiments/p029-browser-companion-r2/installer/**'
      - 'experiments/p029-browser-companion-r2/bridge-integration/**'
      - 'experiments/p029-browser-companion-r2/broker/**'
      - 'experiments/p029-browser-companion-r2/tests/installer-account-binding.test.mjs'
      - '.github/workflows/p029-companion-macos-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-gui-preview:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify account scope and installer logic
        working-directory: experiments/p029-browser-companion-r2
        run: |
          set -e
          for file in installer/*.mjs; do node --check "$file"; done
          node --test tests/*.test.mjs
          node security-qa.mjs
      - name: Compile and sign GUI preview - no installed Mac changed
        working-directory: experiments/p029-browser-companion-r2
        run: |
          set -e
          bash installer/build-macos.sh
          codesign --verify --verbose=2 "dist/desktop-mac-preview/LUCH Browser Companion Setup.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "dist/desktop-mac-preview/LUCH Browser Companion Setup.app/Contents/Info.plist"
          unzip -tq "dist/desktop-mac-preview/LUCH-Browser-Companion-Setup-0.6.0-preview.zip"
          echo "PREVIEW_ONLY: ad-hoc signature, NOT Apple Developer notarized"
      - name: Execute bundled app helper from actual spaced .app path (no live install)
        working-directory: experiments/p029-browser-companion-r2
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.luch/node/v24.16.0/bin"
          ln -sf "$(command -v node)" "$HOME/.luch/node/v24.16.0/bin/node"
          HELPER="$PWD/dist/desktop-mac-preview/LUCH Browser Companion Setup.app/Contents/Resources/install-browser-companion.sh"
          test -x "$HELPER"
          "$HELPER" --list > "$RUNNER_TEMP/empty-accounts.txt"
          test ! -s "$RUNNER_TEMP/empty-accounts.txt"
          set +e
          "$HELPER" --install --device-id dev_notpaired_TEST > "$RUNNER_TEMP/install-fail.txt" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q 'LUCH_INSTALL_ERROR=AUTHORIZED_ACCOUNT_NOT_FOUND' "$RUNNER_TEMP/install-fail.txt"
          echo "REAL_BUNDLED_HELPER_CLI_PASS_SPACED_PATH_AND_FAIL_CLOSED"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: luch-browser-companion-macos-unnotarized-preview
          path: experiments/p029-browser-companion-r2/dist/desktop-mac-preview/LUCH-Browser-Companion-Setup-0.6.0-preview.zip
          if-no-files-found: error
          retention-days: 14
