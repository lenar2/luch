 function onChoice(e){

   // Keep only the last two previously checked audios as an undoable selection.
   undoAudioKeys=audioSelected.filter(key=&amp;gt;key!==keys[checks.indexOf(e.target)]).slice(0,2);

  &lt;span class=&quot;bf220-kicker&quot;&gt;БЕЛАЯ ПЯТНИЦА · С ЗАБОТОЙ&lt;/span&gt;
  &lt;h2 id=&quot;bf220-faq-title&quot;&gt;Частые вопросы&lt;/h2&gt;
  &lt;p class=&quot;bf220-intro&quot;&gt;Всё важное о выборе программ, доступе и условиях покупки.&lt;/p&gt;
  &lt;div class=&quot;bf220-faq-list&quot;&gt;
   &lt;details class=&quot;bf220-faq-item&quot;&gt;
    &lt;summary&gt;Как понять, какая программа мне подходит?&lt;/summary&gt;
    &lt;div class=&quot;bf220-answer&quot;&gt;&lt;p&gt;Выбирайте то направление, которое сейчас наиболее актуально для вас. Если сомневаетесь, Юля поможет подобрать программу под ваш запрос.&lt;/p&gt;&lt;/div&gt;
   &lt;/details&gt;
   &lt;details class=&quot;bf220-faq-item&quot;&gt;
    &lt;summary&gt;Как работает дополнительная скидка на набор?&lt;/summary&gt;
    &lt;div class=&quot;bf220-answer&quot;&gt;&lt;p&gt;Чем больше самостоятельных программ вы выбираете, тем выше скидка — от 10% до 35% сверх уже сниженных цен Белой пятницы.&lt;/p&gt;&lt;p&gt;Вы можете собрать свой сет или выбрать готовый «Максимальный набор».&lt;/p&gt;&lt;/div&gt;
   &lt;/details&gt;
   &lt;details class=&quot;bf220-faq-item&quot;&gt;
    &lt;summary&gt;На какой срок открывается доступ? Можно начать позже?&lt;/summary&gt;
    &lt;div class=&quot;bf220-answer&quot;&gt;&lt;p&gt;Доступ к программам предоставляется на 12 месяцев после покупки. Все материалы в записи, поэтому вы можете заниматься в удобное время, без спешки.&lt;/p&gt;&lt;p&gt;Информация о доступе придёт на указанную при покупке почту.&lt;/p&gt;&lt;/div&gt;
   &lt;/details&gt;
   &lt;details class=&quot;bf220-faq-item&quot;&gt;
    &lt;summary&gt;Можно ли вернуть деньги, если программа мне не подойдёт?&lt;/summary&gt;
    &lt;div class=&quot;bf220-answer&quot;&gt;&lt;p&gt;Да 🤍 Вы можете оформить возврат оплаты в любой момент в течение 14 дней после покупки.&lt;/p&gt;&lt;p&gt;Для этого достаточно обратиться к Юле.&lt;/p&gt;&lt;/div&gt;
   &lt;/details&gt;
   &lt;details class=&quot;bf220-faq-item&quot;&gt;
    &lt;summary&gt;До какого времени действуют скидки?&lt;/summary&gt;
    &lt;div class=&quot;bf220-answer&quot;&gt;&lt;p&gt;Белая пятница продлится до &lt;strong&gt;23 ноября 2026 года, 10:00 по московскому времени&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;До этого момента вы можете приобрести программы по специальным ценам.&lt;/p&gt;&lt;/div&gt;
   &lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;

&lt;footer&gt;&lt;div class=&quot;footer-brand&quot;&gt;БЕЛАЯ ПЯТНИЦА &lt;span&gt;ИСЦЕЛЕНИЯ&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;Татьяна Салимова · &lt;a href=&quot;https://tati-lar.ru/&quot; rel=&quot;noopener noreferrer&quot;&gt;tati-lar.ru&lt;/a&gt;&lt;/p&gt;
&lt;p class=&quot;footer-caution&quot;&gt;Акция действует с 20 ноября 10:00 до 23 ноября 10:00 по московскому времени. Покупка отдельных программ доступна через формы GetCourse. Оформление произвольного сета и программы «Тренер по отношениям» подключается отдельно. Зачёркнутые суммы приведены для сравнения предложений и не обязательно являются прежними ценами на идентичный состав материалов. Уточняйте состав и условия выбранной программы.&lt;/p&gt;
&lt;/footer&gt;
&lt;/main&gt;
&lt;div class=&quot;cart-float&quot; id=&quot;cart-float&quot; hidden&gt;&lt;button type=&quot;button&quot; id=&quot;cart-open&quot; aria-label=&quot;Открыть выбранные предложения&quot;&gt;Мой выбор &lt;span id=&quot;cart-count&quot;&gt;0&lt;/span&gt;&lt;span id=&quot;cart-sum&quot;&gt;0 ₽&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;

&lt;aside class=&quot;cart-panel&quot; id=&quot;cart-panel&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;cart-title&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;cart-header&quot;&gt;&lt;div&gt;&lt;span class=&quot;cart-kicker&quot;&gt;БЕЛАЯ ПЯТНИЦА · ТВОЙ ВЫБОР&lt;/span&gt;&lt;h2 id=&quot;cart-title&quot;&gt;Твой выбор&lt;/h2&gt;&lt;/div&gt;&lt;button id=&quot;cart-close&quot; type=&quot;button&quot; aria-label=&quot;Закрыть&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;

&lt;p class=&quot;cart-message&quot; id=&quot;cart-message&quot; role=&quot;status&quot;&gt;Выбранные предложения собраны здесь. Оформление заказа пока недоступно.&lt;/p&gt;

&lt;div class=&quot;lead-backdrop&quot; id=&quot;lead-backdrop&quot;&gt;&lt;/div&gt;
&lt;aside class=&quot;lead-panel&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;lead-title&quot; tabindex=&quot;-1&quot;&gt;
&lt;button type=&quot;button&quot; class=&quot;lead-close&quot; id=&quot;lead-close&quot; aria-label=&quot;Закрыть форму&quot;&gt;✕&lt;/button&gt;
&lt;h2 id=&quot;lead-title&quot;&gt;Заявка на интеграцию&lt;/h2&gt;
&lt;p&gt;Татьяна лично отберёт два проекта. Заполни форму, скопируй готовую заявку и отправь её сообщением в профиль @tati_lar.&lt;/p&gt;
&lt;form id=&quot;lead-form&quot;&gt;
&lt;label&gt;Название проекта&lt;input name=&quot;project&quot; type=&quot;text&quot; required maxlength=&quot;150&quot; placeholder=&quot;Название проекта&quot;&gt;&lt;/label&gt;
&lt;label&gt;Ссылка на проект&lt;input name=&quot;url&quot; type=&quot;text&quot; maxlength=&quot;300&quot; placeholder=&quot;Сайт или профиль&quot;&gt;&lt;/label&gt;
&lt;label&gt;О проекте&lt;textarea name=&quot;about&quot; rows=&quot;4&quot; maxlength=&quot;1000&quot; required placeholder=&quot;О ценностях и чем занимаетесь&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;
&lt;button type=&quot;submit&quot; class=&quot;lead-copy&quot;&gt;Скопировать заявку&lt;/button&gt;&lt;/form&gt;
&lt;a href=&quot;https://www.instagram.com/tati_lar/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; class=&quot;lead-instagram&quot;&gt;Открыть профиль @tati_lar&lt;/a&gt;
&lt;p class=&quot;lead-status&quot; id=&quot;lead-status&quot; role=&quot;status&quot;&gt;&lt;/p&gt;
&lt;/aside&gt;&lt;/div&gt;

&lt;script&gt;
(function(){
const frame=document.getElementById(&#x27;lot10-set-frame&#x27;);
function nestedSize(){
 const card=frame?.contentDocument?.querySelector(&#x27;.card&#x27;);
 if(!card)return;
 const h=Math.ceil(card.getBoundingClientRect().height+2);
 if(h&gt;300&amp;&amp;frame.style.height!==h+&#x27;px&#x27;)frame.style.height=h+&#x27;px&#x27;;
}
if(frame){
 frame.addEventListener(&#x27;load&#x27;,()=&gt;{
   nestedSize();
   try{new ResizeObserver(nestedSize).observe(frame.contentDocument.querySelector(&#x27;.card&#x27;));}catch(e){}
 });
}
const sourceRadios=[...document.querySelectorAll(&#x27;input[name=&quot;source-variant&quot;]&#x27;)];
const sLink=document.querySelector(&#x27;#lot-9 a.bf179-direct-buy&#x27;);
if(sLink)sourceRadios.forEach(r=&gt;r.addEventListener(&#x27;change&#x27;,()=&gt;{
  sLink.href=&#x27;https://singleladiesschool.getcourse.ru/pl/lite/widget/widget?id=&#x27;+(sourceRadios.find(x=&gt;x.checked)?.value===&#x27;2&#x27;?&#x27;1686774&#x27;:&#x27;1686741&#x27;);
}));
document.querySelectorAll(&#x27;button.art-button&#x27;).forEach(btn=&gt;{
 const card=btn.closest(&#x27;article&#x27;);
 const href=card?.querySelector(&#x27;a.bf179-direct-buy,a.buy-lot[href*=&quot;getcourse&quot;]&#x27;)?.href;
 if(href){
  btn.onclick=()=&gt;window.open(href,&#x27;_blank&#x27;,&#x27;noopener&#x27;);
 }
});
const form=document.querySelector(&#x27;#lead-form&#x27;);
if(form)form.addEventListener(&#x27;submit&#x27;,async e=&gt;{
 e.preventDefault();const d=new FormData(form);
 const msg=&#x27;Заявка на интеграцию в сторис Татьяны Салимовой\nНазвание проекта: &#x27;+(d.get(&#x27;project&#x27;)||&#x27;&#x27;)+&#x27;\nСсылка: &#x27;+(d.get(&#x27;url&#x27;)||&#x27;&#x27;)+&#x27;\nО проекте: &#x27;+(d.get(&#x27;about&#x27;)||&#x27;&#x27;);
 try{await navigator.clipboard.writeText(msg);document.getElementById(&#x27;lead-status&#x27;).textContent=&#x27;Заявка скопирована. Отправьте её в @tati_lar.&#x27;;}
 catch(err){document.getElementById(&#x27;lead-status&#x27;).textContent=&#x27;Скопируйте данные заявки вручную и отправьте в @tati_lar.&#x27;;}
});
const notify=()=&gt;{
 const height=Math.ceil(document.documentElement.scrollHeight);
 parent.postMessage({type:&#x27;bf2026:visual-mirror-height&#x27;,height},&#x27;*&#x27;);
};
window.addEventListener(&#x27;load&#x27;,notify);
window.addEventListener(&#x27;resize&#x27;,notify);
try{new ResizeObserver(notify).observe(document.body)}catch(e){}
document.fonts?.ready?.then(notify);
[200,800,1600,3500].forEach(t=&gt;setTimeout(notify,t));
})();
&lt;/script&gt;

<script>
(function(){
const frame=document.getElementById('bf26-exact-iframe');
if(!frame)return;
function resize(e){
 if(e.source!==frame.contentWindow||e.data?.type!=='bf2026:visual-mirror-height')return;
 const h=Number(e.data.height);
 if(Number.isFinite(h)&&h>1000&&h<100000)frame.style.height=Math.ceil(h+3)+'px';
}
window.addEventListener('message',resize);
})();
</script>
