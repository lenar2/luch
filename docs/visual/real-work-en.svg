cing="1.5">03 / THE RESULT</text><text x="809" y="193" fill="#15392F" font-size="23" font-weight="600">32 routes · visual checks</text><text x="809" y="225" fill="#45695B" font-size="19">Commit · published website</text></g><text x="42" y="291" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#688477">Founder-environment case · not evidence of public self-service onboarding</text></svg>
