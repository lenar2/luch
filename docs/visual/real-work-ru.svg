<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 310" width="1200" height="310"><title id="title">Одна задача. Настоящий результат.</title><desc id="desc">Три шага: основатель попросил изменить сайт, ИИ работал с разрешёнными инструментами, итог можно проверить в коммите и на сайте.</desc><rect width="1200" height="310" rx="18" fill="#F8F7F0"/><path d="M 1 18 Q 1 1 18 1 H 1182 Q 1199 1 1199 18 V 292 Q 1199 309 1182 309 H 18 Q 1 309 1 292Z" fill="none" stroke="#D4DDD1"/><circle cx="48" cy="49" r="6" fill="#EC866A"/><text x="66" y="55" fill="#5C7E6D" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">LUCH / РЕАЛЬНАЯ РАБОТА</text><text x="39" y="94" fill="#15392F" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="600" letter-spacing="-1">Одна задача. Настоящий результат.</text><g font-family="Arial,Helvetica,sans-serif"><rect x="39" y="112" width="350" height="157" rx="11" fill="#FFFFFF" stroke="#D5E2D6"/><text x="61" y="143" fill="#5C7E6D" font-size="15" font-weight="700" letter-spacing="1.5">01 / ЧЕЛОВЕК</text><text x="61" y="193" fill="#15392F" font-size="23" font-weight="600">«Переделай сайт.</text><text x="61" y="225" fill="#45695B" font-size="19">Mac не трогай».</text><path d="M 391 188 h 20" stroke="#E98065" stroke-width="3"/><rect x="413" y="112" width="350" height="157" rx="11" fill="#FFFFFF" stroke="#D5E2D6"/><text x="435" y="143" fill="#5C7E6D" font-size="15" font-weight="700" letter-spacing="1.5">02 / РАБОТА</text><text x="435" y="193" fill="#15392F" font-size="23" font-weight="600">Сайт · GitHub · сервер</text><text x="435" y="225" fill="#45695B" font-size="19">Только разрешённые действия</text><path d="M 765 188 h 20" stroke="#E98065" stroke-width="3"/><rect x="787" y="112" width="350" height="157" rx="11" fill="#E1EEE1" stroke="#D5E2D6"/><text x="809" y="143" fill="#5C7E6D" font-size="15" font-weight="700" letter-spacing="1.5">03 / ИТОГ</text><text x="809" y="193" fill="#15392F" font-size="23" font-weight="600">32 страницы · проверка</text><text x="809" y="225" fill="#45695B" font-size="19">Коммит · опубликованный сайт</text></g><text x="42" y="291" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#688477">Подтверждённый случай в окружении основателя · не доказательство самостоятельного подключения</text></svg>
