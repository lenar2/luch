<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f6f0">
  <title>LUCH · Browser Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header class="heading">
    <div class="brand">
      <img src="assets/luch-brand-r22.svg" alt="" width="46" height="46">
      <div><strong>LUCH</strong><span>Browser Companion</span></div>
    </div>
    <select id="locale" aria-label="Language">
      <option value="en">EN</option>
      <option value="ru">RU</option>
    </select>
  </header>

  <section class="hero">
    <span id="eyebrow"></span>
    <h1 id="headline"></h1>
    <p id="intro"></p>
    <div class="hero-illustration" aria-hidden="true"><img src="assets/connection-journey.svg" alt="" width="360" height="130"></div>
    <div id="capabilities" class="capability-grid">
      <div><span>01</span><b id="cap-read"></b></div>
      <div><span>02</span><b id="cap-navigate"></b></div>
      <div><span>03</span><b id="cap-interact"></b></div>
      <div><span>04</span><b id="cap-capture"></b></div>
    </div>
  </section>

  <div class="connection" id="connection">
    <span id="dot" class="dot"></span>
    <b id="status" role="status" aria-live="polite"></b>
    <small id="scope"></small>
  </div>
  <p id="feedback" role="alert" aria-live="polite"></p>

  <section id="pairing">
    <label id="pair-label" for="pairCode"></label>
    <p id="pair-hint" class="hint pair-leading-hint"></p>
    <div class="actions">
      <input id="pairCode" type="text" inputmode="numeric" pattern="[0-9]{8}"
        autocomplete="off" maxlength="8" spellcheck="false" placeholder="••••••••">
      <button id="pair" type="button" disabled></button>
    </div>
    <details class="setup-card setup-details">
      <summary id="setup-title"></summary>
      <ol id="setup-steps"></ol>
      <p id="setup-boundary" class="boundary-note"></p>
    </details>
    <div class="links">
      <a id="local-setup" href="https://luch.lenarsalimov.ru/en/connect/" target="_blank" rel="noopener noreferrer"></a>
      <a id="help" href="https://luch.lenarsalimov.ru/en/connect/" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </section>

  <section id="controls" hidden>
    <div id="tab-box" class="tab-box">
      <span id="tab-label"></span>
      <b id="currentTab" class="truncate"></b>
      <small id="currentUrl" class="truncate"></small>
    </div>
    <div id="shareStatus" class="access-status" role="status" aria-live="polite"></div>
    <div id="permission-explainer" class="journey-step" hidden>
      <span class="step-kicker" id="permission-kicker"></span>
      <h2 id="permission-heading"></h2>
      <p id="permission-description"></p>
      <div class="permission-benefits">
        <span id="permission-benefit-read"></span>
        <span id="permission-benefit-action"></span>
        <span id="permission-benefit-files"></span>
      </div>
      <p id="permission-footnote" class="permission-footnote"></p>
    </div>
    <div id="ready-card" class="journey-step ready-step" hidden>
      <span class="step-kicker" id="ready-kicker"></span>
      <h2 id="ready-heading"></h2>
      <p id="ready-description"></p>
      <div class="prompt-suggestion" id="ready-prompt" role="note"></div>
    </div>
    <div id="offline-card" class="journey-step offline-step" hidden>
      <h2 id="offline-heading"></h2>
      <p id="offline-description"></p>
    </div>
    <div class="control-stack">
      <button id="grant" type="button" hidden></button>
      <button id="interact" type="button" class="interact" hidden></button>
      <button id="revoke" type="button" class="secondary"></button>
    </div>
    <details id="advanced" class="advanced-browser">
      <summary id="advanced-title"></summary>
      <div class="advanced-content">
      <h2 id="tabs-heading"></h2>
      <p id="tabs-explain" class="hint"></p>
      <button id="list-tabs" type="button" class="secondary"></button>
      <div id="tab-list-wrap" hidden>
        <ol id="tab-list"></ol>
        <button id="share-tabs" type="button" class="interact" hidden></button>
        <button id="unshare-tabs" type="button" class="secondary" hidden></button>
      </div>
      <div id="tabs-sharing-state" class="hint" role="status"></div>
      <h2 id="cursor-heading" hidden></h2>
      <p id="cursor-explain" class="hint" hidden></p>
      <button id="enable-cursor" type="button" class="interact" hidden></button>
      <button id="disable-cursor" type="button" class="secondary" hidden></button>
      </div>
    </details>
    <p id="session-note" class="hint"></p>
    <p id="host-note" class="host-note"></p>
    <div class="separation"></div>
    <button id="disconnect" type="button" class="danger"></button>
  </section>

  <footer>
    <span id="footer"></span>
    <a id="learn" href="https://luch.lenarsalimov.ru/en/browser/" target="_blank" rel="noopener noreferrer"></a>
  </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
