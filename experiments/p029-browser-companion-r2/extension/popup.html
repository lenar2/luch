<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#143c43">
  <title>LUCH · Browser Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="app">
  <header class="heading" aria-label="LUCH Browser Companion">
    <div class="brand">
      <img class="brand-logo" src="assets/luch-brand-r22.svg" alt="LUCH brand logo" width="83" height="83">
      <div class="brand-type">
        <strong id="brand-name">LUCH</strong>
        <span id="brand-subtitle">BROWSER COMPANION</span>
      </div>
    </div>
    <select id="locale" aria-label="Language">
      <option value="en">EN</option>
      <option value="ru">RU</option>
    </select>
  </header>

  <div class="brand-rule" aria-hidden="true"><span></span></div>

  <section class="hero">
    <span id="eyebrow" class="eyebrow"></span>
    <h1 id="headline"></h1>
    <p id="intro"></p>
    <div id="capabilities" class="capabilities" aria-label="Browser operations">
      <div class="capabilities-count">
        <strong id="feature-count">100</strong>
        <span id="feature-caption">BROWSER OPERATIONS</span>
      </div>
      <ul class="capability-list">
        <li><span aria-hidden="true">01</span><b id="cap-read"></b></li>
        <li><span aria-hidden="true">02</span><b id="cap-navigate"></b></li>
        <li><span aria-hidden="true">03</span><b id="cap-interact"></b></li>
        <li><span aria-hidden="true">04</span><b id="cap-capture"></b></li>
      </ul>
    </div>
  </section>

  <div class="connection" id="connection">
    <span id="dot" class="dot" aria-hidden="true"></span>
    <b id="status" role="status" aria-live="polite"></b>
    <small id="scope"></small>
  </div>
  <p id="feedback" role="alert" aria-live="polite"></p>

  <section id="pairing">
    <div class="pairing-heading">
      <label id="pair-label" for="pairCode"></label>
      <p id="pair-hint" class="hint pair-leading-hint"></p>
    </div>
    <div class="actions">
      <input id="pairCode" type="text" inputmode="numeric" pattern="[0-9]{8}"
        autocomplete="off" maxlength="8" spellcheck="false" placeholder="••••••••">
      <button id="pair" type="button" disabled></button>
    </div>
    <details class="setup-card setup-details">
      <summary id="setup-title"></summary>
      <ol id="setup-steps"></ol>
      <p id="setup-boundary" class="boundary-note"></p>
    </details>
    <div class="links">
      <a id="local-setup" href="https://luch.lenarsalimov.ru/en/connect/" target="_blank" rel="noopener noreferrer"></a>
      <a id="help" href="https://luch.lenarsalimov.ru/en/connect/" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </section>

  <section id="controls" hidden>
    <div id="tab-box" class="tab-box">
      <span id="tab-label"></span>
      <b id="currentTab" class="truncate"></b>
      <small id="currentUrl" class="truncate"></small>
    </div>
    <div id="shareStatus" class="access-status" role="status" aria-live="polite"></div>

    <div id="permission-explainer" hidden>
      <span id="permission-kicker"></span><h2 id="permission-heading"></h2>
      <p id="permission-description"></p>
      <div id="permission-benefit-read"></div><div id="permission-benefit-action"></div><div id="permission-benefit-files"></div>
      <p id="permission-footnote"></p>
    </div>

    <div id="ready-card" class="ready-step" hidden>
      <span id="ready-kicker" class="section-kicker"></span>
      <h2 id="ready-heading"></h2>
      <p id="ready-description"></p>
      <div id="ready-prompt" class="prompt-suggestion" role="note"></div>
    </div>
    <div id="offline-card" class="offline-step" hidden>
      <h2 id="offline-heading"></h2><p id="offline-description"></p>
    </div>

    <div class="control-stack">
      <button id="grant" type="button" hidden></button>
      <button id="interact" type="button" class="interact" hidden></button>
      <button id="revoke" type="button" class="secondary"></button>
    </div>

    <details id="advanced" class="advanced-browser" hidden>
      <summary id="advanced-title"></summary>
      <div class="advanced-content">
        <h2 id="tabs-heading"></h2>
        <p id="tabs-explain" class="hint"></p>
        <button id="list-tabs" type="button" class="secondary"></button>
        <div id="tab-list-wrap" hidden>
          <ol id="tab-list"></ol>
          <button id="share-tabs" type="button" hidden></button>
          <button id="unshare-tabs" type="button" hidden></button>
        </div>
        <div id="tabs-sharing-state" class="hint" role="status"></div>
        <h2 id="cursor-heading" hidden></h2>
        <p id="cursor-explain" hidden></p>
        <button id="enable-cursor" type="button" hidden></button>
        <button id="disable-cursor" type="button" hidden></button>
      </div>
    </details>

    <p id="session-note" class="hint"></p>
    <p id="host-note" class="host-note"></p>
    <button id="disconnect" type="button" class="danger"></button>
  </section>

  <footer>
    <span id="footer"></span>
    <a id="learn" href="https://luch.lenarsalimov.ru/en/browser/" target="_blank" rel="noopener noreferrer"></a>
  </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
